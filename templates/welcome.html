<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Commission Cloud - Real Cashback</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='welcome.css') }}?v=5">
</head>
<body>

  <div class="welcome-container">
    
    <!-- Top Header -->
    <header class="header-section">
      <div class="trust-badge">100% Guaranteed Cashback</div>
      <h1 class="main-title">Get Real Cashback On Top Brands</h1>
    </header>

    <!-- Visual Interactive Stage -->
    <div class="stage-wrapper" id="stageWrapper">
      
      <!-- Central Model -->
      <img src="{{ url_for('static', filename='images/model.png.jpeg') }}" class="hero-model" alt="Commission Cloud Model">

      <!-- Phone Origin Point (Mobile Screen Core) -->
      <div class="phone-origin-point" id="phoneOrigin">
        <div class="phone-core-glow"></div>
      </div>

      <!-- Commission Cloud 7% Card -->
      <div class="brand-card card-commission">
        <svg viewBox="0 0 24 24" fill="#00A3FF" width="22" height="22">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
        <div class="card-info">
          <span class="brand-name">Commission Cloud</span>
          <span class="cashback-badge">Cashback 7%</span>
        </div>
      </div>

      <!-- Brand Cards (मोबाइल से बाहर निकलकर चारों तरफ छितराएंगे) -->
      <img src="{{ url_for('static', filename='images/card-flipkard.png.jpeg') }}" class="brand-card card-flipkart" alt="Flipkart">
      <img src="{{ url_for('static', filename='images/card-amazon.png.jpeg') }}" class="brand-card card-amazon" alt="Amazon">
      <img src="{{ url_for('static', filename='images/card-meesho.png.jpeg') }}" class="brand-card card-meesho" alt="Meesho">
      <img src="{{ url_for('static', filename='images/card-myntra.png.jpeg') }}" class="brand-card card-myntra" alt="Myntra">

      <!-- Base Coins Pile at Bottom -->
      <div class="coins-base-wrapper">
        <img src="{{ url_for('static', filename='images/coins.png.jpeg') }}" class="coins-base" alt="Coins Base">
      </div>

    </div>

    <!-- Bottom Action Button -->
    <div class="bottom-action">
      <button class="cta-btn" id="startBtn" onclick="handleStartMegaBlast(event)">Get Started</button>
    </div>

  </div>

  <script>
    // 🔊 1. सिक्कों की खन-खन आवाज़ (Gold Coins Chime Sound via Web Audio API)
    function playCoinChimeSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        // सोने के सिक्कों की खनकती हुई 7 उच्च आवृत्तियाँ (frequencies)
        const notes = [1046.50, 1318.51, 1567.98, 2093.00, 2637.02, 3135.96, 4186.01];

        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + (index * 0.035));

          // खनक की गूँज और फैलाव (Decay)
          gain.gain.setValueAtTime(0.35, ctx.currentTime + (index * 0.035));
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (index * 0.035) + 0.6);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + (index * 0.035));
          osc.stop(ctx.currentTime + (index * 0.035) + 0.6);
        });
      } catch (err) {
        console.log("Audio not supported or blocked:", err);
      }
    }

    // ✨ 2. मोबाइल के अंदर से सिक्के निकलकर ब्लिंक होना (Continuous Fountain)
    function launchCoinFromPhone() {
      const stage = document.getElementById('stageWrapper');
      if (!stage) return;

      const coinCount = 5;
      for (let i = 0; i < coinCount; i++) {
        const coin = document.createElement('div');
        coin.className = 'phone-blinking-coin';

        const angle = -0.4 + (Math.random() * (Math.PI + 0.8)); 
        const dist = 60 + Math.random() * 110;
        const tx = Math.cos(angle) * (Math.random() > 0.5 ? dist : -dist) + 'px';
        const ty = (-Math.sin(angle) * dist * 1.2) + 'px';

        coin.style.setProperty('--tx', tx);
        coin.style.setProperty('--ty', ty);

        stage.appendChild(coin);

        setTimeout(() => {
          coin.remove();
        }, 1100);
      }
    }

    // हर 1 सेकंड में मोबाइल से सिक्के निकलते रहेंगे
    setInterval(launchCoinFromPhone, 1000);

    // 💥 3. 'Get Started' दबाने पर: खन-खन आवाज़ + महा-धमाका (Mega Coin Explosion)
    function handleStartMegaBlast(e) {
      const stage = document.getElementById('stageWrapper');
      const btn = e.currentTarget;

      // तुरंत सिक्कों की खन-खन आवाज़ बजेगी
      playCoinChimeSound();

      // मोबाइल के अंदर से 30 सिक्के तेज़ी से पूरे स्क्रीन पर छितराएंगे
      for (let i = 0; i < 30; i++) {
        const blastCoin = document.createElement('div');
        blastCoin.className = 'mega-blast-coin';

        const angle = Math.random() * Math.PI * 2;
        const dist = 120 + Math.random() * 220;
        const tx = Math.cos(angle) * dist + 'px';
        const ty = Math.sin(angle) * dist + 'px';

        blastCoin.style.setProperty('--tx', tx);
        blastCoin.style.setProperty('--ty', ty);

        stage.appendChild(blastCoin);
      }

      btn.style.filter = "brightness(1.5)";

      // आवाज़ और ब्लास्ट पूरा महसूस होने के बाद लॉगिन पेज खुलेगा
      setTimeout(() => {
        window.location.href = '/login';
      }, 650);
    }
  </script>

</body>
</html>
